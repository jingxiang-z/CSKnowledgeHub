[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpuinfo-nvml-lab"
version = "0.1.0"
description = "Read-only NVML GPU inspection CLI"
requires-python = ">=3.11"
dependencies = ["nvidia-ml-py>=12.550,<14"]

[project.scripts]
gpuinfo = "gpuinfo.cli:main"

[tool.setuptools.packages.find]
include = ["gpuinfo*"]
